[package]
name = "tauri-plugin-fastdict-mobile"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
links = "tauri-plugin-fastdict-mobile"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
