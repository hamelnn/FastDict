[package]
name = "fastdict"
version = "0.2.1"
description = "A lightweight screenshot and clipboard translator"
authors = ["FastDict"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "fastdict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
tauri-plugin-fastdict-mobile = { path = "plugins/fastdict-mobile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time"] }
xcap = "0.9.8"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
