[package]
name = "fastdict"
version = "0.4.0"
description = "A lightweight screenshot and clipboard translator"
authors = ["FastLingo"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "fastdict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-http = "2"
tauri-plugin-fastdict-mobile = { path = "plugins/fastdict-mobile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tokio = { version = "1", features = ["time", "net", "io-util", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
jsonwebtoken = "9.3"
sha2 = "0.10"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.10"
fs2 = "0.4"
zeroize = "1"
xcap = "0.9.8"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
