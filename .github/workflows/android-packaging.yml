name: Build Android test APK

# Compile relevant source changes. Debug signing is for testing only.
on:
  workflow_dispatch:
  push:
    paths: &mobile-paths
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package*.json'
      - 'index.html'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/android-packaging.yml'
  pull_request:
    paths: *mobile-paths

permissions:
  contents: read

concurrency:
  group: fastdict-android-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-arm64:
    name: ARM64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'
      - name: Set up Android command-line tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # This applies only to the disposable CI runner, never a user's SDK.
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android SDK on the disposable runner
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - name: Initialize Android project without installing more Rust targets
        run: npm run android:init
      - name: Build and verify test APK
        run: npm run android:build
      - name: Upload test package and verification manifest
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FastLingo-Android-arm64-debug-${{ github.run_number }}
          path: |
            release/android/*.apk
            release/android/manifest-*.json
            release/android/README-Android.txt
            release/android/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 14
