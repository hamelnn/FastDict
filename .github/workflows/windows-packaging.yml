name: Build Windows installer and portable app

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastdict-windows-packaging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 NSIS and portable ZIP
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm run check
      - name: Build unsigned installer and portable package
        run: npm run windows:installer -- --target=x86_64-pc-windows-msvc
      - name: Verify executable version and package hashes
        shell: pwsh
        run: |
          $manifest = Get-Content release/manifest.json -Raw | ConvertFrom-Json
          $actualVersion = (Get-Item release/FastLingo.exe).VersionInfo.ProductVersion
          if ($actualVersion -ne $manifest.version) { throw 'Executable version does not match the release manifest.' }
          foreach ($artifact in $manifest.artifacts) {
            $path = Join-Path release $artifact.name
            if ((Get-Item $path).Length -ne $artifact.bytes) { throw 'Artifact size mismatch.' }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $artifact.sha256) { throw 'Artifact hash mismatch.' }
          }
      - name: Stage exactly the outer delivery inventory
        run: node scripts/verify-windows-delivery.mjs release --stage=release/windows-delivery
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: FastLingo-Windows-x64-${{ github.run_number }}
          path: release/windows-delivery/
          if-no-files-found: error
          retention-days: 14
      - name: Download the delivered artifact for independent verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: FastLingo-Windows-x64-${{ github.run_number }}
          path: release/windows-downloaded
      - name: Verify downloaded inventory and hashes
        run: node scripts/verify-windows-delivery.mjs release/windows-downloaded
