name: Verify FastLingo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fastdict-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  desktop:
    name: Native build (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - name: Verify platform build entry points (including Windows-only cases)
        run: npm run test:scripts
      - name: Check Rust and platform dependencies
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Verify native screenshot encoding
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      # Tauri runs the frontend build once through beforeBuildCommand.
      # Compile without publishing releases, packaging, or requiring signing keys.
      # See https://v2.tauri.app/distribute/pipelines/github/ and tauri-action README.
      - name: Build native app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        with:
          tauriScript: npm run tauri
          args: --no-bundle -- --locked
